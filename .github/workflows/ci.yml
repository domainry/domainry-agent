name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: domainry-agent
      # These source contracts are being released together. Keep CI on the
      # same coordinated source graph that developers exercise via go.work.
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-agent-sdk
          path: domainry-agent-sdk
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-foundation
          path: domainry-foundation
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-identity-sdk
          path: domainry-identity-sdk
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-connectors
          path: domainry-connectors
          token: ${{ secrets.DOMAINRY_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-identity
          path: domainry-identity
          token: ${{ secrets.DOMAINRY_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: domainry-agent/go.sum
      - name: Configure access to private Domainry modules
        env:
          DOMAINRY_MODULE_TOKEN: ${{ secrets.DOMAINRY_GITHUB_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${DOMAINRY_MODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/domainry/*
          go env -w GONOSUMDB=github.com/domainry/*
          go env -w GONOPROXY=github.com/domainry/*
      - name: Prepare coordinated Go workspace
        run: go work init ./domainry-agent ./domainry-agent-sdk ./domainry-foundation ./domainry-identity-sdk ./domainry-connectors ./domainry-identity
      - name: Check Go formatting
        working-directory: domainry-agent
        run: |
          unformatted="$(find . -path './docs/evidence' -prune -o -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt required:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test all Agent packages
        working-directory: domainry-agent
        run: go test ./...
      - name: Test Identity publication regression
        working-directory: domainry-identity
        run: go test ./internal/infrastructure/persistence/database/metadata
      - name: Race-check task and protocol boundaries
        working-directory: domainry-agent
        run: >-
          go test -race
          ./integration
          ./module
          ./remote
          ./server
          ./internal/application
          ./internal/infrastructure/provider
          ./internal/infrastructure/persistence/database/agent
          ./internal/assembly/web
          ./internal/infrastructure/persistence/webhost
      - name: Vet Agent packages
        working-directory: domainry-agent
        run: go vet ./...
      - name: Build Agent packages
        working-directory: domainry-agent
        run: go build ./...
  playground-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: domainry-agent
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-integration-sdk
          path: domainry-integration-sdk
          token: ${{ secrets.DOMAINRY_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: domainry/domainry-tools-sdk
          path: domainry-tools-sdk
          token: ${{ secrets.DOMAINRY_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: domainry-agent/frontend/package-lock.json
      - name: Install playground UI dependencies
        run: npm --prefix domainry-agent/frontend ci
      - name: Test conversation draft and error behavior
        run: npm --prefix domainry-agent/frontend test
      - name: Type-check and build playground UI
        run: npm --prefix domainry-agent/frontend run build
